
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip -o QuizonatorLocal-GitHub-Ready.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle

      - name: Build APK
        run: gradle -p project assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: QuizonatorLocal-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
